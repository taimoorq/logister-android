name: Dependency Submission

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Report the library and test classpaths. Android Gradle Plugin and
          # publishing-plugin classpaths are build tools, not dependencies of
          # the published SDK, and otherwise create unactionable consumer alerts.
          dependency-graph-include-configurations: ".*(Compile|Runtime)Classpath$"
