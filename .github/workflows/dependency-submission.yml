name: Dependency Submission

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-36"
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # Report the library and test classpaths. Android Gradle Plugin and
          # publishing-plugin classpaths are build tools, not dependencies of
          # the published SDK, and otherwise create unactionable consumer alerts.
          dependency-graph-include-configurations: ".*(Compile|Runtime)Classpath$"
