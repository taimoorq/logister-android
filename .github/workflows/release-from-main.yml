name: Release from main

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: write
  actions: write

concurrency:
  group: release-from-main
  cancel-in-progress: false

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Check out released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Confirm released commit is current main
        id: main
        env:
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          current_main_sha="$(git rev-parse refs/remotes/origin/main)"

          if [ "$CANDIDATE_SHA" = "$current_main_sha" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping release because CI ran for $CANDIDATE_SHA, while main is now $current_main_sha. The successful CI run for current main will handle the release."
          fi

      - name: Resolve release tag
        if: steps.main.outputs.current == 'true'
        id: version
        run: |
          version="$(sed -nE 's/^VERSION_NAME=(.+)$/\1/p' gradle.properties | head -n 1)"
          bash scripts/validate-release-metadata.sh "$version"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Create or recover immutable release and dispatch publication
        if: steps.main.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: >-
          python3 scripts/prepare-release.py
          --tag "$RELEASE_TAG"
          --workflow release.yml
          --paths src/main README.md LICENSE CHANGELOG.md build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat consumer-rules.pro
