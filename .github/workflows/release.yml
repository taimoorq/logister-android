name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable vX.Y.Z tag to publish or recover
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify immutable tag belongs to reviewed main
        run: bash scripts/verify-release-ref.sh

      - name: Set release version
        id: release_version
        run: |
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify checked-in version
        run: |
          actual="${{ steps.release_version.outputs.version }}"
          bash scripts/validate-release-metadata.sh "$actual"


      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          awk -v heading="## v${RELEASE_VERSION} " '
            index($0, heading) == 1 { in_release = 1; next }
            in_release && /^## v/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Check Maven Central package version
        id: maven_package
        run: |
          present=0
          for artifact in logister-android logister-android-okhttp; do
            url="https://repo1.maven.org/maven2/org/logister/$artifact/${{ steps.release_version.outputs.version }}/$artifact-${{ steps.release_version.outputs.version }}.pom"
            status="$(curl --silent --show-error --head --location --output /dev/null --write-out '%{http_code}' "$url")"
            case "$status" in
              200) present=$((present + 1)) ;;
              404) ;;
              *) echo "::error::Maven lookup failed with HTTP $status; publication state is unknown."; exit 1 ;;
            esac
          done
          case "$present" in
            0) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            2) echo "exists=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::Only one Android artifact is public. Recover the existing deployment before retrying; do not reupload an accepted artifact."; exit 1 ;;
          esac

      - name: Verify secrets are configured
        if: steps.maven_package.outputs.exists != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name repository secret."
              exit 1
            fi
          done

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Run release checks
        run: ./gradlew clean check assembleRelease javaDocReleaseGeneration --no-daemon -PVERSION_NAME="${{ steps.release_version.outputs.version }}"

      - name: Inspect Android archive file list
        run: |
          for archive in build/outputs/aar/logister-android-release.aar okhttp/build/outputs/aar/okhttp-release.aar; do
            test -f "$archive"
            if unzip -Z1 "$archive" | grep -Eq '(^|/)(\.env|tmp/release-|[^/]+\.(key|pem|p12|pfx))$|^/|\.\./'; then
              echo "::error::Android archive contains a publication-unsafe path."
              exit 1
            fi
          done

      - name: Retain the tested Android archive for recovery
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logister-android-${{ steps.release_version.outputs.version }}-${{ github.run_attempt }}
          path: |
            build/outputs/aar/logister-android-release.aar
            okhttp/build/outputs/aar/okhttp-release.aar
          if-no-files-found: error
          retention-days: 30

      - name: Publish signed deployment to Maven Central
        if: steps.maven_package.outputs.exists != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        # Central can take 10–30 minutes to expose a validated deployment.
        # Wait on its existing deployment before checking the public CDN.
        run: ./gradlew publishToMavenCentral -PmavenCentralDeploymentValidation=PUBLISHED -PVERSION_NAME="${{ steps.release_version.outputs.version }}"

      - name: Verify Maven Central publication
        run: |
          for artifact in logister-android logister-android-okhttp; do
            url="https://repo1.maven.org/maven2/org/logister/$artifact/${{ steps.release_version.outputs.version }}/$artifact-${{ steps.release_version.outputs.version }}.pom"
            local_aar="build/outputs/aar/logister-android-release.aar"
            if [ "$artifact" = logister-android-okhttp ]; then local_aar="okhttp/build/outputs/aar/okhttp-release.aar"; fi
            verified=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent --head --location "$url" >/dev/null && curl --fail --silent --location "${url%.pom}.aar" --output "published-$artifact.aar"; then
                cmp "$local_aar" "published-$artifact.aar"
                verified=true
                break
              fi
              sleep 20
            done
            if [ "$verified" != true ]; then
              echo "::error::Maven Central did not expose $artifact within the verification window."
              exit 1
            fi
          done

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
