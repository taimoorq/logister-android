name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 0.1.1.
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set release version
        id: release_version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "${INPUT_VERSION:-}" ]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$'; then
            echo "::error::Version must be semantic, for example 0.1.1."
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Verify checked-in version
        run: |
          actual="${{ steps.release_version.outputs.version }}"
          bash scripts/validate-release-metadata.sh "$actual"

          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$actual" ]; then
            echo "::error::Release v$actual must run from its exact v$actual tag, not $GITHUB_REF."
            exit 1
          fi

      - name: Prepare release notes
        env:
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          awk -v heading="## v${RELEASE_VERSION} " '
            index($0, heading) == 1 { in_release = 1; next }
            in_release && /^## v/ { exit }
            in_release { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Check Maven Central package version
        id: maven_package
        run: |
          url="https://repo1.maven.org/maven2/org/logister/logister-android/${{ steps.release_version.outputs.version }}/logister-android-${{ steps.release_version.outputs.version }}.pom"
          if curl --fail --silent --head --location "$url" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "logister-android ${{ steps.release_version.outputs.version }} already exists on Maven Central."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify secrets are configured
        if: steps.maven_package.outputs.exists != 'true'
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD SIGNING_KEY SIGNING_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing $name repository secret."
              exit 1
            fi
          done

      - name: Secret scan
        run: bash scripts/secret-scan.sh

      - name: Run release checks
        run: ./gradlew clean check assembleRelease javaDocReleaseGeneration --no-daemon -PVERSION_NAME="${{ steps.release_version.outputs.version }}"

      - name: Inspect Android archive file list
        run: |
          archive="build/outputs/aar/logister-android-release.aar"
          test -f "$archive"
          if unzip -Z1 "$archive" | grep -Eq '(^|/)(\.env|tmp/release-|[^/]+\.(key|pem|p12|pfx))$|^/|\.\./'; then
            echo "::error::Android archive contains a publication-unsafe path."
            exit 1
          fi

      - name: Publish signed deployment to Maven Central
        if: steps.maven_package.outputs.exists != 'true'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishToMavenCentral -PVERSION_NAME="${{ steps.release_version.outputs.version }}"

      - name: Verify Maven Central publication
        run: |
          url="https://repo1.maven.org/maven2/org/logister/logister-android/${{ steps.release_version.outputs.version }}/logister-android-${{ steps.release_version.outputs.version }}.pom"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --head --location "$url" >/dev/null; then
              aar_url="${url%.pom}.aar"
              curl --fail --silent --location "$aar_url" --output published.aar
              cmp build/outputs/aar/logister-android-release.aar published.aar
              exit 0
            fi
            sleep 20
          done
          echo "::error::Maven Central did not expose the release within the verification window."
          exit 1

      - name: Create or update GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.release_version.outputs.tag }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --verify-tag \
              --title "$TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi
